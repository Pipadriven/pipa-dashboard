server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Os arquivos de build levam hash no nome: podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index.html NUNCA pode ser cacheado. Se ficar, o navegador continua
    # pedindo os arquivos da versão anterior, eles não existem mais, e a
    # tela abre em branco depois de todo deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
